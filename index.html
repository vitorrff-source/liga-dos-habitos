<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<title>Liga dos Hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: abas (Hoje · Rotas · Equipe · Mochila · Coleção · Calendário); "Hoje" junta hábitos, pontos, rota atual e ações; cenas abrem num painel sobreposto */
:root {
  --frame: #dfe5e2;
  --bg: #f1f4f2; --surface: #ffffff; --fg: #1d2522; --muted: #66716c; --line: #dde3e0; --soft: #e8eeea;
  --fisica: #e0642c; --alim: #2f9a5c; --skin: #a457c4;
  --gold: #e3a70f; --gold-soft: #fdf3d6;
  --focus: #1d2522; --good: #2f9a5c; --warn: #d89a0b; --bad: #d4462f;
  --sky: #dceff4; --grass: #cfe8c4; --overlay: rgba(20, 28, 25, .55);
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --frame: #0b0f0d;
    --bg: #121715; --surface: #1a201e; --fg: #e8eeeb; --muted: #95a19b; --line: #2b3431; --soft: #222a27;
    --fisica: #f0814d; --alim: #4fbf7e; --skin: #c27fdd; --gold: #f2c13b; --gold-soft: #3a3118;
    --focus: #e8eeeb; --good: #4fbf7e; --warn: #f2c13b; --bad: #f06b54;
    --sky: #1f3238; --grass: #22362a; --overlay: rgba(0, 0, 0, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --frame: #0b0f0d;
  --bg: #121715; --surface: #1a201e; --fg: #e8eeeb; --muted: #95a19b; --line: #2b3431; --soft: #222a27;
  --fisica: #f0814d; --alim: #4fbf7e; --skin: #c27fdd; --gold: #f2c13b; --gold-soft: #3a3118;
  --focus: #e8eeeb; --good: #4fbf7e; --warn: #f2c13b; --bad: #f06b54;
  --sky: #1f3238; --grass: #22362a; --overlay: rgba(0, 0, 0, .65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 64px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-weight: 800; font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.05; letter-spacing: -0.015em; }
.sync { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.wallet { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 6px; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }
.pill .pti { vertical-align: middle; }
.pill .dot { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 800; }
.pill.money .dot { background: var(--gold); color: #1d2522; }

.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 4px; background: var(--bg); padding-block: 6px; overflow-x: auto; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.tab[aria-selected="true"] { background: var(--fg); color: var(--bg); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; min-width: 0; }
.card h2 { font-weight: 700; font-size: 1.15rem; }
.lead { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 18px; min-width: 0; align-content: start; }

/* hábitos */
.checks { display: grid; gap: 8px; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); cursor: pointer; user-select: none; position: relative; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.box svg { width: 14px; height: 14px; opacity: 0; }
.check input:checked + .box { border-color: var(--c); background: var(--c); }
.check input:checked + .box svg { opacity: 1; }
.check input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }
.check .lbl { font-weight: 600; display: block; }
.check .hint { display: block; font-size: 12px; color: var(--muted); }
.check .gain { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--c); white-space: nowrap; }
.check.fisica { --c: var(--fisica); } .check.alim { --c: var(--alim); } .check.skin { --c: var(--skin); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--fg); text-decoration: underline; text-underline-offset: 3px; font-size: 13px; }

/* pontos */
.points { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pt { border-radius: 12px; padding: 10px; background: var(--soft); display: grid; gap: 4px; }
.pt b { font-family: var(--display); font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; color: var(--c); }
.pt span { font-size: 12px; color: var(--muted); }
.pips { display: flex; gap: 3px; }
.pips i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.pips i.on { background: var(--c); }
.week { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.wk { display: grid; grid-template-columns: 92px minmax(0, 1fr) 36px; gap: 8px; align-items: center; font-size: 13px; }
.wk .bar { height: 8px; border-radius: 4px; background: var(--soft); overflow: hidden; }
.wk .bar i { display: block; height: 100%; background: var(--c); }
.wk span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.goldnote { padding: 8px 10px; border-radius: 10px; background: var(--soft); font-size: 13px; }
.goldnote.on { background: var(--gold-soft); }

/* rota */
.banner { border-radius: 14px; padding: 16px; color: #fff; position: relative; overflow: hidden; min-height: 120px; display: grid; align-content: end; gap: 4px; }
.banner.photo { min-height: 190px; }
.scene.photo { background-size: cover; background-position: center 70%; }
.banner h2 { font-size: 1.5rem; font-weight: 800; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.banner p { font-size: 13px; max-width: 60ch; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
.banner .eyebrow { color: rgba(255,255,255,.85); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; color: #1d2522; letter-spacing: .02em; white-space: nowrap; }
.rchip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.thead { display: flex; align-items: center; gap: 12px; }
.thead h2 { margin: 0; }
.tpic { width: 84px; height: 84px; flex: none; border-radius: 16px; object-fit: cover; background: var(--soft); border: 2px solid var(--line); }
.tnext { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--soft); border: 2px solid var(--line); align-self: center; margin-right: 4px; }
.trainers { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.tdot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; background: var(--soft); border: 2px solid var(--line); color: var(--muted); }
.tdot.done { background: var(--good); border-color: var(--good); color: #fff; }
.tdot.next { border-color: var(--fg); color: var(--fg); }

/* ações */
.actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 460px) { .actions { grid-template-columns: minmax(0, 1fr); } }
.action { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); transition: transform .12s, border-color .12s; }
.action:hover:not(:disabled) { border-color: var(--fg); transform: translateY(-1px); }
.action:disabled { opacity: .5; cursor: not-allowed; }
.action b { font-family: var(--display); font-size: 1.02rem; }
.action span { font-size: 13px; color: var(--muted); line-height: 1.35; grid-column: 1 / -1; }
.cost { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--c, var(--muted)); white-space: nowrap; align-self: center; }

.notice { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft); font-weight: 600; }
.btn { background: var(--soft); border: 1px solid transparent; border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--line); }
.btn.primary { background: var(--fg); color: var(--bg); }
.btn.primary:hover:not(:disabled) { opacity: .9; }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.ptbtn { border: 2px solid var(--c); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 700; display: grid; text-align: left; min-width: 120px; }
.ptbtn small { font-weight: 500; color: var(--muted); font-size: 12px; }
.ptbtn:disabled { opacity: .4; cursor: not-allowed; }

/* monstrinhos */
.art { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 1 / 1; object-fit: contain; }
.party { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 112px), 1fr)); gap: 10px; }
.mini { border-radius: 12px; background: var(--soft); padding: 8px 10px 10px; min-width: 0; display: grid; gap: 4px; }
.mini .art { width: 72px; margin: 0 auto; }
.mini .nm { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .lv { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mini.down .art { filter: grayscale(1); opacity: .5; }
.hp { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; }
.hp i { display: block; height: 100%; background: var(--good); transition: width .45s ease; }
.hp i.mid { background: var(--warn); } .hp i.low { background: var(--bad); }
.cond { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 4px; color: #fff; text-transform: uppercase; letter-spacing: .04em; }
.cond.queimadura { background: #d4462f; } .cond.paralisia { background: #c99700; } .cond.envenenamento { background: #8a4fb0; } .cond.congelamento { background: #3f8fc4; } .cond.desmaiado { background: #66716c; }

.mons { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 12px; }
.mon { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; align-items: start; }
.mon .art { width: 92px; background: var(--soft); border-radius: 12px; }
.mon h3 { font-size: 1.08rem; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.stats6 { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px; margin: 6px 0; font-size: 11px; text-align: center; font-variant-numeric: tabular-nums; }
.stats6 span { background: var(--soft); border-radius: 6px; padding: 2px 0; }
.stats6 b { display: block; font-size: 13px; }
.xp { height: 5px; border-radius: 3px; background: var(--soft); overflow: hidden; margin: 4px 0 6px; }
.xp i { display: block; height: 100%; background: var(--gold); }
.moves { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.mv { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--tc, var(--line)); }

/* rotas */
.routes { display: grid; gap: 8px; }
.route { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.route .no { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; color: #fff;  text-shadow: 0 1px 4px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.7); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.route.locked { opacity: 1; }
.route.locked > * { opacity: .6; }
.route.locked .no { filter: grayscale(.8); }
.route.here { border: 2px solid var(--fg); padding: 9px 11px; }
.route b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.route small.lockcond { display: block; margin-top: 2px; text-wrap: balance; }
.route small { color: var(--muted); font-size: 12px; }

/* coleção */
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.dx { border: 1px solid var(--line); border-radius: 14px; padding: 10px; text-align: center; background: var(--surface); min-width: 0; display: grid; gap: 4px; justify-items: center; }
.dx .art { width: 84px; }
.dx .no { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dx .nm { font-weight: 700; font-size: 14px; }
.dx.unseen .art { filter: brightness(0); opacity: .18; }
:root[data-theme="dark"] .dx.unseen .art { filter: brightness(0) invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dx.unseen .art { filter: brightness(0) invert(1); } }
.mythics { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.myth { border-radius: 14px; padding: 14px; background: var(--soft); display: grid; gap: 6px; }
.myth.on { background: var(--gold-soft); }
.myth .q { font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1; color: var(--muted); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 14px; }
.stat + .stat { margin-top: 12px; }
.stat .v { font-variant-numeric: tabular-nums; color: var(--muted); }
.stat .bar { grid-column: 1 / -1; }
.progress { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; font-size: 14px; }
.progress b { font-family: var(--display); font-size: 1.5rem; font-variant-numeric: tabular-nums; display: block; line-height: 1.1; }

/* mochila e loja */
.items { display: grid; gap: 8px; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); }
.item.hasimg { grid-template-columns: 44px minmax(0, 1fr) auto; }
.item .itemimg, .item .orbimg { width: 44px; height: 44px; object-fit: contain; }
.item b { display: block; }
.item small { color: var(--muted); font-size: 12px; }
.qty { font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* calendário */
.calwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
@media (max-width: 860px) { .calwrap { grid-template-columns: minmax(0, 1fr); } }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.month { font-weight: 700; font-size: 1.3rem; text-transform: capitalize; }
.cgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.dow { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; text-align: center; padding-bottom: 4px; }
.day { aspect-ratio: 1 / 1.05; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 6px; display: flex; flex-direction: column; justify-content: space-between; text-align: left; min-width: 0; }
.day:hover { border-color: var(--muted); }
.day.out { visibility: hidden; }
.day .n { font-family: var(--display); font-weight: 500; font-size: 15px; font-variant-numeric: tabular-nums; line-height: 1; }
.day.today .n { color: var(--bg); background: var(--fg); border-radius: 6px; padding: 3px 5px; align-self: flex-start; }
.day.sel { border: 2px solid var(--fg); padding: 5px; }
.day.full { background: var(--soft); }
.day.future { opacity: .55; }
.dpips { display: flex; gap: 3px; }
.dpip { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.dpip.on.fisica { background: var(--fisica); } .dpip.on.alim { background: var(--alim); } .dpip.on.skin { background: var(--skin); }
@media (max-width: 480px) { .cgrid { gap: 4px; } .day { padding: 4px; border-radius: 8px; } .day.sel { padding: 3px; } .day .n { font-size: 13px; } .dpip { height: 5px; } }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 6px; border-radius: 3px; display: inline-block; }

.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 14px; }
.log li { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; }
.log time { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 2px; }

.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.starter { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 12px; text-align: center; display: grid; gap: 6px; justify-items: center; }
.starter:hover { border-color: var(--fg); }
.starter .art { width: 110px; }
.starter b { font-family: var(--display); font-size: 1.1rem; }

/* formato de celular */
html { background: var(--frame); }
body { background: var(--frame); margin: 0; }
.app { max-width: 412px; margin: 0 auto; min-height: 100dvh; background: var(--navbg, #121715); position: relative; padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
@media (min-width: 480px) { .app { box-shadow: 0 0 0 1px var(--line), 0 30px 80px rgba(0,0,0,.18); } }
#view { min-height: 100dvh; }
.page { padding: 18px 14px calc(84px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.pagehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pagehead h1 { font-size: 1.6rem; }
.rotasbg { position: relative; z-index: 0; color: #fff; --fg: #fff; --bg: #1d2522; --surface: rgba(18, 26, 22, .4); --muted: rgba(255,255,255,.82); --line: rgba(255,255,255,.35); --soft: rgba(255,255,255,.14); --focus: #fff; }
.rotasbg .ptitle h1 { text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.rotasbg h2, .rotasbg h3 { text-shadow: 0 1px 8px rgba(0,0,0,.45); }
.rotasbg > * { position: relative; z-index: 1; }
.rotasbg > .rbg { position: fixed; z-index: -1; top: 0; bottom: 0; left: 50%; width: min(100%, 412px); transform: translateX(-50%); background-size: cover; background-position: center 60%; }
.rotasbg > .rbg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.1) 30%, rgba(0,0,0,.1) 70%, rgba(0,0,0,.35) 100%); }
.rotasbg .pagehead h1, .rotasbg .pagehead .sync { color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
.home .hud .pd, .rotasbg .hud .pd { font-size: 16px; padding: 3px 9px 3px 4px; }
.rotasbg .hud .st { font-size: 17px; }
.rotasbg .hud { color: #fff; }
.rotasbg .card { background: rgba(18, 26, 22, .34); border: 1px solid rgba(255,255,255,.35); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; }
.rotasbg .muted, .rotasbg .small { color: rgba(255,255,255,.85); }
.rotasbg .action { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); color: #fff; }
.rotasbg .action:hover:not(:disabled) { border-color: #fff; }
.rotasbg .action span { color: rgba(255,255,255,.88); }
.rotasbg .action:disabled { opacity: 1; }
.rotasbg .action:disabled > * { opacity: .5; }
.rotasbg .tdot { background: rgba(255,255,255,.14); border-color: rgba(255,255,255,.4); color: #fff; }

/* ======================= regras: monstrinhos ======================= */
function statsOf(m) {
  const b = SP[m.sp].b;
  return b.map((v, i) => Math.floor((2 * v + m.var[i]) * m.lvl / 100) + (i === 0 ? m.lvl + 10 : 5) + (m.bonus?.[i] || 0));
}
const maxHp = m => statsOf(m)[0];
const need = L => L * CFG.xp_para_subir_fator;
const isDown = m => m.hp <= 0;
function learnedAt(sp, lvl) {
  const out = [];
  SP[sp].learn.filter(l => l.via === "nivel" && l.valor <= lvl).sort((a, b) => a.valor - b.valor).forEach(l => { if (MV[l.golpe] && !out.includes(l.golpe)) out.push(l.golpe); });
  return out.slice(-CFG.golpes_max);
}
function newMon(sp, lvl) {
  const m = { id: game.nextId++, sp, lvl, xp: 0, var: Array.from({ length: 6 }, () => ri(0, CFG.var_max)), bonus: [0, 0, 0, 0, 0, 0], nbonus: 0, hp: 0, cond: null, moves: learnedAt(sp, lvl) };
  m.hp = maxHp(m);
  game.mons.push(m);
  if (!game.dex.includes(sp)) game.dex.push(sp);
  if (game.equipe.length < CFG.equipe_max) game.equipe.push(m.id);
  return m;
}
const getMon = id => game.mons.find(m => m.id === id);
const partyMons = () => game.equipe.map(getMon).filter(Boolean);
const reserveMons = () => game.mons.filter(m => !game.equipe.includes(m.id));
function evolve(m, to, out) {
  const before = maxHp(m), from = m.sp;
  m.sp = to; m.hp = Math.max(1, m.hp + maxHp(m) - before);
  if (!game.dex.includes(to)) game.dex.push(to);
  out.push({ evo: [from, to] });
  addLog(`${SP[from].n} evoluiu para ${SP[to].n}!`);
}
/* Várias evoluções com a mesma condição: sorteia uma. Nível: vale o maior nível já atingido. */

function migrate(g) {

    const f = freshGame();
    const out = Object.assign(f, g);
    out.tutorial = g.tutorial !== undefined ? !!g.tutorial : out.mons.length > 0;  /* quem já joga não precisa do tutorial */
    out.tour = g.tour !== undefined ? !!g.tour : out.mons.length > 0;  /* saves antigos com monstrinhos não precisam do tour */
    if (out.inv && out.inv.reanimar) { out.dinheiro += 600 * out.inv.reanimar; delete out.inv.reanimar; }  /* Reanimar saiu do jogo: devolve o preço em moedas */

    out.mons = out.mons.filter(m => SP[m.sp]);

    out.rota = clamp(out.rota, 0, ROUTES.length - 1);

  const old = g; game = freshGame();
  const map = {};
  (old.creatures || []).forEach(c => {
    const sp = SP[c.sp] ? c.sp : "javalmar";
    const m = newMon(sp, clamp(c.lvl || 5, 2, CFG.nivel_max));
    map[c.id] = m.id;

  game.equipe = (old.party || []).map(id => map[id]).filter(Boolean);
  game.mons.forEach(m => { if (game.equipe.length < CFG.equipe_max && !game.equipe.includes(m.id)) game.equipe.push(m.id); });

}

function creditPoints() {

  const wk = mondayKey();
  if (game.semana.inicio !== wk) { game.semana = { inicio: wk, ganhos: zeroPts(), entregue: false }; changed = true; }
  const keep = [yesterdayKey(), todayKey()];
  for (const k of keep) {
    const v = habits[k] || {}, c = game.cred[k] || [];
    for (const p of PT) {
      if (v[p.h] && !c.includes(p.k)) {
        c.push(p.k);
        if (game.pontos[p.k] < CFG.pontos_max_por_tipo) game.pontos[p.k]++;
        if (k >= wk) game.semana.ganhos[p.k]++;
        changed = true;
      } else if (!v[p.h] && c.includes(p.k) && game.pontos[p.k] > 0) {
        c.splice(c.indexOf(p.k), 1); game.pontos[p.k]--;
        if (k >= wk && game.semana.ganhos[p.k] > 0) game.semana.ganhos[p.k]--;
        changed = true;

/* Contexto do destaque: além do elemento a tocar (anel amarelo pulsante), fica visível a caixa inteira onde ele está

function tutCtx(st, el) {

  const c = el.closest(".item") || el.closest(".mon") || el.closest(".route") || el.closest("#sheet") || el.closest(".acts3") || el.closest(".hud") || el.closest("section.card");

function tutLayout(st, el) {
  const W = innerWidth, H = innerHeight;
  const box = (id, x, y, w, h) => { const e = $(id); e.style.cssText = `left:${x}px;top:${y}px;width:${Math.max(0, w)}px;height:${Math.max(0, h)}px;display:${w > 0 && h > 0 ? "block" : "none"}`; };
  const ring = $("#tring"), cring = $("#tctx");
  const ctx = el && !st.full && !st.nomask ? tutCtx(st, el) : null;
  if (st.nomask) { ["#tmT", "#tmB", "#tmL", "#tmR"].forEach(i => box(i, 0, 0, 0, 0)); ring.hidden = true; cring.hidden = true; }
  else if (!el || st.full) { box("#tmT", 0, 0, W, H); ["#tmB", "#tmL", "#tmR"].forEach(i => box(i, 0, 0, 0, 0)); ring.hidden = true; cring.hidden = true; }
  else {
    const rc = ctx.getBoundingClientRect(), pad = st.pad ?? 6;

    box("#tmT", 0, 0, W, y); box("#tmB", 0, y + h, W, H - y - h); box("#tmL", 0, y, x, h); box("#tmR", x + w, y, W - x - w, h);
    const rt = el.getBoundingClientRect();
    const clicavel = !(st.ok && !st.wait);   /* passo só informativo (botão Continuar): a área fica visível, sem anel amarelo */
    /* passo informativo: um bloqueio invisível sobre a área em foco impede que o jogador toque nos botões dela (ex.: "Ir") */
    cring.hidden = clicavel; if (!clicavel) cring.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    if (ctx !== el) {
      ring.hidden = !clicavel; ring.style.cssText = `left:${rt.left - 4}px;top:${rt.top - 4}px;width:${rt.width + 8}px;height:${rt.height + 8}px`;
    } else { ring.hidden = !clicavel; ring.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`; }
  }

        const a = 12, b = H - bh - 12;

      bub.style.top = Math.round(top) + "px"; bub.style.bottom = "auto";

    }
  }
}

let tourSteps = [], tourI = 0;
function startTour() { tourSteps = TOUR.filter(s => !s.skip || !s.skip()); tourI = 0; $("#tour").hidden = false; drawTour(); }
function drawTour() {
  const s = tourSteps[tourI], n = tourSteps.length;
  if (tab !== s.tab) setTab(s.tab);
  $$(".nb").forEach(b => b.classList.toggle("tourhl", b.dataset.tab === s.tab && tourI > 0 && !s.last));
  $("#tourcard").innerHTML = `<h2 id="tourT">${s.t}</h2>${s.p.map(x => `<p>${x}</p>`).join("")}${s.extra ? s.extra() : ""}
    <div class="tourdots" aria-label="Passo ${tourI + 1} de ${n}">${tourSteps.map((_, i) => `<i class="${i === tourI ? "on" : ""}"></i>`).join("")}</div>
    <div class="tourbtns">${s.last ? "<span></span>" : `<button class="skip" id="tourSkip">Pular tour</button>`}<span class="row">${tourI > 0 ? `<button class="btn" id="tourPrev">Voltar</button>` : ""}<button class="btn primary" id="tourNext">${s.last ? "Começar" : "Próximo"}</button></span></div>`;
  $("#tourNext").onclick = () => tourI < n - 1 ? (tourI++, drawTour()) : endTour();
  const pv = $("#tourPrev"); if (pv) pv.onclick = () => { tourI--; drawTour(); };
  const sk = $("#tourSkip"); if (sk) sk.onclick = endTour;
  $("#tourNext").focus();
}
function endTour() {
  $("#tour").hidden = true; $$(".nb").forEach(b => b.classList.remove("tourhl"));
  if (!game.tour) { game.tour = true; saveGame(); }
  setTab("inicio");
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#tour").hidden) endTour(); });

/* Anel da semana: 3 arcos (Exercício, Alimentação, Skincare) que enchem até a meta; completos = Orbe Raro. */
function weekRing(px = 30) {
  const meta = CFG.meta_semanal_por_tipo, R = 11, C = 2 * Math.PI * R, gap = 4, L = C / 3 - gap;
  const arcs = PT.map((p, i) => {
    const f = clamp((game.semana.ganhos[p.k] || 0) / meta, 0, 1), rot = -90 + i * 120 + (gap / 2) * 360 / C;
    const a = `cx="14" cy="14" r="${R}" fill="none" stroke-width="3.4" stroke-linecap="butt" transform="rotate(${rot} 14 14)"`;
    return `<circle ${a} stroke="rgba(255,255,255,.25)" stroke-dasharray="${L} ${C}"/>${f > 0 ? `<circle ${a} stroke="${p.c}" stroke-dasharray="${L * f} ${C}"/>` : ""}`;
  }).join("");
  return `<svg width="${px}" height="${px}" viewBox="0 0 28 28" aria-hidden="true">${arcs}</svg>`;

let _dexOrder = null;
function dexOrder() {

  for (const r of ROUTES) for (const m of [...(r.pool || [])].filter(x => byId.has(x.especie) && !byId.get(x.especie).starter).sort((a, b) => (b.peso || 0) - (a.peso || 0) || pos.get(a.especie) - pos.get(b.especie))) coloca(raiz(m.especie));

    const cls = ["day", k === keyOf(today) && "today", k === keyOf(calSel) && "sel", done === 3 && "full", date > today && "future"].filter(Boolean).join(" ");

  }

  const isCurrent = y === today.getFullYear() && m === today.getMonth();

  let s = 0; const dd = todayDate(); const full = dt => { const v = habits[keyOf(dt)] || {}; return PT.every(p => v[p.h]); };
  if (!full(dd)) dd.setDate(dd.getDate() - 1);
  while (full(dd)) { s++; dd.setDate(dd.getDate() - 1); }
  return `<div class="calwrap">
    <section class="card">
      <div class="cal-head"><h2 class="month">${fmtMonth.format(calView)}</h2><div class="row"><button class="btn sm" id="prev" aria-label="Mês anterior">‹</button><button class="btn sm" id="todayBtn">Hoje</button><button class="btn sm" id="next" aria-label="Próximo mês">›</button></div></div>
      <div class="cgrid">${cells}</div>
      <div class="legend">${PT.map(p => `<span><i class="sw" style="background:${p.c}"></i>${p.habit}</span>`).join("")}</div>
    </section>
    <div class="col">
      <section class="card"><h2>${isT ? "Hoje" : isY ? "Ontem" : "Dia " + calSel.getDate()}</h2><p class="lead" style="text-transform:capitalize">${fmtDay.format(calSel)}</p>
        <div class="checks">${habitChecks(sk)}</div><p class="small muted" style="margin-top:12px">${sn === 3 ? "Dia completo. " : `${sn} de 3 feitos. `}${isT || isY ? "Hoje e ontem geram pontos no jogo." : sk > todayKey() ? "Dias futuros não podem ser marcados." : "Dias mais antigos ficam no histórico, sem gerar pontos."}</p></section>
      <section class="card"><h2>${isCurrent ? "Este mês até hoje" : "No mês"}</h2><div style="margin-top:12px">${stats}</div><div class="streak" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)"><b style="font-family:var(--display);font-size:1.4rem">${s}</b> ${s === 1 ? "dia completo" : "dias completos"} seguidos</div></section>
    </div>
  </div>`;
}

const MAPA_W = 1500, MAPA_H = 1611;
/* regiões: nº das rotas (de..até), centro na imagem (x, y). A região 13 (Florestas Encantadas) ainda não está na imagem. */
const MAPA_REG = [

  { n: "Metrópole de Brinquedo", de: 21, ate: 28, x: 456, y: 1135 }, { n: "Desertos e Cânions", de: 29, ate: 35, x: 639, y: 918 },
  { n: "Mata Sombria", de: 36, ate: 40, x: 280, y: 878 }, { n: "Vulcão e Outono", de: 41, ate: 49, x: 946, y: 964 },
  { n: "Porto e Noite Flutuante", de: 50, ate: 56, x: 154, y: 1123 }, { n: "Selvas e Pântanos", de: 57, ate: 63, x: 479, y: 668 },
  { n: "Costa Tropical", de: 64, ate: 70, x: 1288, y: 1066 }, { n: "Lagos e Rios", de: 71, ate: 79, x: 787, y: 725 },
  { n: "Terras Geladas", de: 80, ate: 83, x: 679, y: 497 }, { n: "Capital Dourada", de: 84, ate: 90, x: 1106, y: 713 },
  { n: "Florestas Encantadas", de: 91, ate: 105 },
  { n: "Montanhas", de: 106, ate: 108, x: 1300, y: 440 }, { n: "Céus Flutuantes", de: 109, ate: 113, x: 935, y: 417 },
  { n: "Pico do Horizonte", de: 114, ate: 117, x: 1106, y: 155 }
];
const MP = { s: 1, x: 0, y: 0, ptrs: new Map(), sel: null, img: null, labels: null };
function mapaEstado(rg) {
  const idx = ROUTES.map((r, i) => i).filter(i => ROUTES[i].no >= rg.de && ROUTES[i].no <= rg.ate);
  if (idx.includes(game.rota)) return "aqui";
  if (idx.some(i => game.visitadas.includes(i))) return "explorada";
  return "bloqueada";
}
function mapaDesenha() {
  const cv = document.createElement("canvas"); cv.width = MAPA_W; cv.height = MAPA_H;
  const c = cv.getContext("2d", { willReadFrequently: true }); c.drawImage(MP.img, 0, 0, MAPA_W, MAPA_H);
  const reg = MAPA_REG.filter(r => r.x != null);
  if (!MP.labels) {   /* qual região é a mais próxima de cada ponto (para escurecer as não descobertas) */
    const L = new Uint8Array(MAPA_W * MAPA_H);
    for (let y = 0; y < MAPA_H; y++) for (let x = 0; x < MAPA_W; x++) { let b = 0, bd = 1e12; for (let k = 0; k < reg.length; k++) { const dx = x - reg[k].x, dy = y - reg[k].y, d = dx * dx + dy * dy; if (d < bd) { bd = d; b = k; } } L[y * MAPA_W + x] = b; }
    MP.labels = L;
  }
  const dark = reg.map(r => mapaEstado(r) === "bloqueada");
  if (dark.some(Boolean)) {
    const im = c.getImageData(0, 0, MAPA_W, MAPA_H), d = im.data;
    for (let i = 0, n = MAPA_W * MAPA_H; i < n; i++) if (dark[MP.labels[i]]) { d[i * 4] *= .22; d[i * 4 + 1] *= .26; d[i * 4 + 2] *= .32; }
    c.putImageData(im, 0, 0);
  }
  return cv;
}
function mapaApply() { $("#mpin").style.transform = `translate(${MP.x}px, ${MP.y}px) scale(${MP.s})`; }
function mapaClamp() {
  const w = $("#mpwrap").clientWidth, h = $("#mpwrap").clientHeight, sw = MAPA_W * MP.s, sh = MAPA_H * MP.s;
  MP.x = sw <= w ? (w - sw) / 2 : Math.min(60, Math.max(w - sw - 60, MP.x));
  MP.y = sh <= h ? (h - sh) / 2 : Math.min(60, Math.max(h - sh - 60, MP.y));
}
function mapaZoomAt(px, py, ns) {
  const w = $("#mpwrap").clientWidth, h = $("#mpwrap").clientHeight, min = Math.min(w / MAPA_W, h / MAPA_H) * .95;
  ns = Math.min(min * 6, Math.max(min, ns)); const k = ns / MP.s;
  MP.x = px - (px - MP.x) * k; MP.y = py - (py - MP.y) * k; MP.s = ns; mapaClamp(); mapaApply();
}
function mapaInfo(k) {
  const rg = MAPA_REG[k], info = $("#mpinfo"), st = mapaEstado(rg); MP.sel = k;
  document.querySelectorAll("#mapov .mpsel").forEach(e => e.remove());
  if (rg.x != null) { const el = document.createElement("div"); el.className = "mpsel"; el.style.cssText = `left:${rg.x - 150}px;top:${rg.y - 150}px;width:300px;height:300px`; $("#mpin").appendChild(el); }
  const mv = maxVisited(), unlock = canUnlockNext();
  const idx = ROUTES.map((r, i) => i).filter(i => ROUTES[i].no >= rg.de && ROUTES[i].no <= rg.ate);
  const rows = idx.filter(i => game.visitadas.includes(i) || i === mv + 1).map(i => {
    const r = ROUTES[i], vis = game.visitadas.includes(i), next = i === mv + 1;
    let btn;
    if (i === game.rota) btn = `<span class="rchip">Você está aqui</span>`;
    else if (vis || (next && unlock)) btn = `<button class="btn sm" data-mgo="${i}" ${anyPts() ? "" : "disabled"}>Ir (1 ${anyIcon(14)})</button>`;
    else btn = `<span class="rchip">Bloqueada</span>`;
    return `<div class="mpr"><b>${r.no}. ${esc(vis || next ? r.n : "???")}</b>${btn}</div>`;
  }).join("");
  info.hidden = false;
  info.innerHTML = `<h3>${st === "bloqueada" ? "Região ainda não descoberta" : esc(rg.n)}</h3><div class="sub">Rotas ${rg.de} a ${rg.ate}${st === "aqui" ? " · você está aqui" : ""}</div>${st === "bloqueada" ? "" : rows}`;
  info.querySelectorAll("[data-mgo]").forEach(b => b.onclick = () => { closeMapa(); askMove(+b.dataset.mgo); });
  $("#mpdica").hidden = true;
}
function mapaPick(px, py) {
  const gx = (px - MP.x) / MP.s, gy = (py - MP.y) / MP.s; let best = -1, bd = 200 * 200;
  MAPA_REG.forEach((r, k) => { if (r.x == null) return; const dx = gx - r.x, dy = gy - r.y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = k; } });
  if (best >= 0) mapaInfo(best); else { MP.sel = null; $("#mpinfo").hidden = true; document.querySelectorAll("#mapov .mpsel").forEach(e => e.remove()); }
}
function openMapa() {
  if (!MP.img) { MP.img = new Image(); MP.img.onload = openMapa; MP.img.src = "mapa-mundi.webp"; return; }
  if (!MP.img.complete || !MP.img.naturalWidth) return;
  const ov = $("#mapov"), wrap = $("#mpwrap"), inn = $("#mpin");
  ov.hidden = false; inn.innerHTML = ""; $("#mpinfo").hidden = true; $("#mpdica").hidden = false; MP.sel = null;
  const cv = mapaDesenha(); inn.style.width = MAPA_W + "px"; inn.style.height = MAPA_H + "px"; inn.appendChild(cv);
  const cur = MAPA_REG.find(r => r.x != null && mapaEstado(r) === "aqui");
  if (cur) { const pin = document.createElement("div"); pin.className = "mppin"; pin.style.cssText = `left:${cur.x}px;top:${cur.y}px`; pin.innerHTML = "<i></i>"; inn.appendChild(pin); }
  const w = wrap.clientWidth, h = wrap.clientHeight, fit = Math.min(w / MAPA_W, h / MAPA_H) * .95;
  MP.s = cur ? fit * 2.2 : fit; MP.x = cur ? w / 2 - cur.x * MP.s : 0; MP.y = cur ? h / 2 - cur.y * MP.s : 0; mapaClamp(); mapaApply();
}
function closeMapa() { $("#mapov").hidden = true; $("#mpin").innerHTML = ""; }
const openMap = openMapa;
(function mapaEventos() {
  const wrap = $("#mpwrap");
  const pos = e => { const r = wrap.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  let moved = 0, t0 = 0, pinch = 0;
  wrap.addEventListener("pointerdown", e => {
    if (e.target.closest("button") || e.target.closest(".mpinfo")) return;
    wrap.setPointerCapture(e.pointerId); MP.ptrs.set(e.pointerId, pos(e));
    if (MP.ptrs.size === 1) { moved = 0; t0 = performance.now(); }
    if (MP.ptrs.size === 2) { const [a, b] = [...MP.ptrs.values()]; pinch = Math.hypot(a[0] - b[0], a[1] - b[1]); moved = 99; }
  });
  wrap.addEventListener("pointermove", e => {
    if (!MP.ptrs.has(e.pointerId)) return;
    const old = MP.ptrs.get(e.pointerId), np = pos(e);
    if (MP.ptrs.size === 1) { MP.x += np[0] - old[0]; MP.y += np[1] - old[1]; moved += Math.abs(np[0] - old[0]) + Math.abs(np[1] - old[1]); mapaClamp(); mapaApply(); MP.ptrs.set(e.pointerId, np); }
    else if (MP.ptrs.size === 2) {
      MP.ptrs.set(e.pointerId, np); const [a, b] = [...MP.ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
      if (pinch) mapaZoomAt((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, MP.s * d / pinch); pinch = d;
    }
  });
  const up = e => {
    if (!MP.ptrs.has(e.pointerId)) return;
    const was = MP.ptrs.size; MP.ptrs.delete(e.pointerId);
    if (was === 1 && moved < 8 && performance.now() - t0 < 600) { const [x, y] = pos(e); mapaPick(x, y); }
    if (MP.ptrs.size < 2) pinch = 0;
  };
  wrap.addEventListener("pointerup", up); wrap.addEventListener("pointercancel", up);
  wrap.addEventListener("wheel", e => { e.preventDefault(); const [x, y] = pos(e); mapaZoomAt(x, y, MP.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15)); }, { passive: false });
  $("#mpclose").onclick = closeMapa;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#mapov").hidden) closeMapa(); });
})();

    a.innerHTML = `<p class="small muted" style="margin-bottom:8px">${B.mode === "forced" ? "Quem entra agora?" : "Trocar gasta o turno."}</p><div class="picker">${B.mine.map((f, i) => `<button class="pick" data-sw="${i}" ${i === B.mi || f.hp <= 0 ? "disabled" : ""}>${art(f.sp)}<span><b>${esc(SP[f.sp].n)}</b><small>Nv ${f.lvl} · ${Math.max(0, f.hp)}/${f.st[0]} PV</small></span>${chips(SP[f.sp].t)}</button>`).join("")}</div>${B.mode === "switch" ? `<div class="row" style="margin-top:8px"><button class="btn sm" id="bBack">Voltar</button></div>` : ""}`;
    $$("[data-sw]").forEach(b => b.onclick = () => B.mode === "forced" ? forcedSwitch(+b.dataset.sw) : turn({ kind: "switch", idx: +b.dataset.sw }));
    const bk = $("#bBack"); if (bk) bk.onclick = () => { B.mode = "moves"; drawActs(); };
  } else if (B.mode === "items") {
    a.innerHTML = `<p class="small muted" style="margin-bottom:8px">Usar item gasta o turno.</p><div class="items">${battleItems().map(id => `<div class="item"><div><b>${esc(IT[id].n)} <span class="qty">×${game.inv[id]}</span></b><small>${esc(IT[id].d)}</small></div><button class="btn sm" data-bit="${id}">Usar</button></div>`).join("")}</div><div class="row" style="margin-top:8px"><button class="btn sm" id="bBack">Voltar</button></div>`;
    $$("[data-bit]").forEach(b => b.onclick = () => { B.mode = "itemTarget"; B.item = b.dataset.bit; drawActs(); });
    $("#bBack").onclick = () => { B.mode = "moves"; drawActs(); };
  } else if (B.mode === "itemTarget") {
    const id = B.item;
    a.innerHTML = `<p class="small muted" style="margin-bottom:8px">Em quem usar ${esc(IT[id].n)}?</p><div class="picker">${B.mine.map((f, i) => `<button class="pick" data-it="${i}" ${itemTargetOk(id, { ...f.ref, hp: f.hp, cond: f.cond }) ? "" : "disabled"}>${art(f.sp)}<span><b>${esc(SP[f.sp].n)}</b><small>${Math.max(0, f.hp)}/${f.st[0]} PV${f.cond ? " · " + COND_NAME[f.cond].toLowerCase() : ""}</small></span><span></span></button>`).join("")}</div><div class="row" style="margin-top:8px"><button class="btn sm" id="bBack">Voltar</button></div>`;
    $$("[data-it]").forEach(b => b.onclick = () => turn({ kind: "item", id, idx: +b.dataset.it }));
    $("#bBack").onclick = () => { B.mode = "items"; drawActs(); };
  } else a.innerHTML = "";
}
function battleItems() { return Object.keys(game.inv).filter(id => game.inv[id] > 0 && IT[id] && IT[id].cat === "cura"); }
function lockActs(on) { $$("#acts button").forEach(b => b.disabled = on || b.disabled); if (!on) drawActs(); }
const stageM = (f, k) => STAGE_MULT[clamp(f.stg[k], -3, 3) + 3];
function eSpeed(f) { return f.st[5] * stageM(f, "vel") * (f.cond === "paralisia" ? .5 : 1); }
function typeEff(mt, sp) { return SP[sp].t.reduce((a, t) => a * ((D.types[mt] || {})[t] ?? 1), 1); }
function calcDamage(a, d, mid) {
  const m = MV[mid], phys = m.c === "fisico";
  let A = (phys ? a.st[1] * stageM(a, "atq") : a.st[3] * stageM(a, "ate"));
  if (phys && a.cond === "queimadura") A *= .5;
  const Df = phys ? d.st[2] * stageM(d, "def") : d.st[4] * stageM(d, "dfe");
  const base = Math.floor(Math.floor(Math.floor(2 * a.lvl / 5 + 2) * m.p * A / Df) / 50) + 2;
  const stab = SP[a.sp].t.includes(m.t) ? 1.5 : 1, e = typeEff(m.t, d.sp);
  return { dmg: e === 0 ? 0 : Math.max(1, Math.floor(base * stab * e * rnd(.85, 1))), e };
}
const IMMUNE = { queimadura: ["fogo"], paralisia: ["eletrico"], envenenamento: ["veneno", "metal"], congelamento: ["gelo"] };
const COND_OF = { queimar: "queimadura", paralisar: "paralisia", envenenar: "envenenamento", congelar: "congelamento" };
const nameOf = (f, side) => (side === "foe" ? "O " : "") + SP[f.sp].n;
async function applyEffect(m, a, d, aSide, dmg) {
  const { a: kind, b } = parseEf(m.ef); const dSide = aSide === "me" ? "foe" : "me";
  if (COND_OF[kind]) {
    const c = COND_OF[kind];
    if (d.hp > 0 && !d.cond && !SP[d.sp].t.some(t => (IMMUNE[c] || []).includes(t))) { d.cond = c; drawBars(); say(`${nameOf(d, dSide)} ficou ${COND_NAME[c].toLowerCase()}!`); await sleep(700); }
  } else if (kind === "hesitar") { if (!B.acted[dSide]) B.flinch[dSide] = true; }
  else if (kind === "drenar") { const h = Math.max(1, Math.floor(dmg * parseInt(b) / 100)); a.hp = Math.min(a.st[0], a.hp + h); drawBars(); say(`${nameOf(a, aSide)} recuperou ${h} PV.`); await sleep(600); }
  else if (kind === "recuo") { const h = Math.max(1, Math.floor(dmg * parseInt(b) / 100)); a.hp = Math.max(0, a.hp - h); drawBars(); say(`${nameOf(a, aSide)} se machucou com o impacto.`); await sleep(600); }
  else if (kind === "cura") { const h = Math.floor(a.st[0] * parseInt(b) / 100); a.hp = Math.min(a.st[0], a.hp + h); drawBars(); say(`${nameOf(a, aSide)} recuperou energia.`); await sleep(600); }
  else if (kind === "proprio" || kind === "alvo") {
    const mm = b.match(/^(\w+)([+-])(\d+)$/); if (!mm) return;
    const tgt = kind === "proprio" ? a : d, tSide = kind === "proprio" ? aSide : dSide;
    if (tgt.hp <= 0) return;
    const before = tgt.stg[mm[1]]; tgt.stg[mm[1]] = clamp(before + (mm[2] === "+" ? 1 : -1) * +mm[3], -3, 3);
    const lab = SK[ATR.indexOf(mm[1])];
    say(tgt.stg[mm[1]] === before ? `${lab} de ${nameOf(tgt, tSide)} não muda mais.` : `${lab} de ${nameOf(tgt, tSide)} ${mm[2] === "+" ? "subiu" : "caiu"}!`); await sleep(650);
  }
}
async function doMove(a, d, mid, side) {
  const m = MV[mid], an = nameOf(a, side), dSide = side === "me" ? "foe" : "me";
  if (a.cond === "congelamento") { if (Math.random() < .2) { a.cond = null; drawBars(); say(`${an} descongelou!`); await sleep(600); } else { say(`${an} está congelado e não se mexe.`); await sleep(700); return; } }
  if (a.cond === "paralisia" && Math.random() < .25) { say(`${an} está paralisado e não conseguiu agir.`); await sleep(700); return; }
  if (B.flinch[side]) { say(`${an} hesitou e perdeu a vez.`); await sleep(700); return; }
  say(`${an} usou ${m.n}!`); await sleep(650);
  if (m.a != null && Math.random() * 100 >= m.a) { say("Errou!"); await sleep(600); return; }
  if (m.c === "status") { await applyEffect(m, a, d, side, 0); return; }
  const { dmg, e } = calcDamage(a, d, mid);
  d.hp = Math.max(0, d.hp - dmg);
  const spr = side === "me" ? $("#foeSprite") : $("#meSprite");
  spr.classList.remove("shake", "pop"); void spr.offsetWidth; spr.classList.add("shake");
  drawBars();
  if (e === 0) { say("Não teve efeito…"); await sleep(700); return; }
  if (e > 1) { say("Foi super eficaz!"); await sleep(700); } else if (e < 1) { say("Não foi muito eficaz…"); await sleep(700); } else await sleep(350);
  if (d.cond === "congelamento" && m.t === "fogo" && d.hp > 0) { d.cond = null; drawBars(); say(`${nameOf(d, dSide)} descongelou com o calor!`); await sleep(600); }
  if (m.ef && (m.ch == null || Math.random() * 100 < m.ch)) await applyEffect(m, a, d, side, dmg);
}
function aiMove(a, d) {
  const heal = a.moves.find(id => parseEf(MV[id].ef).a === "cura");
  if (heal && a.hp / a.st[0] < .35 && Math.random() < .6) return heal;
  const scored = a.moves.map(id => { const m = MV[id]; if (m.c === "status") return { id, s: parseEf(m.ef).a === "cura" ? 0 : 18 * Math.random() }; return { id, s: m.p * typeEff(m.t, d.sp) * (SP[a.sp].t.includes(m.t) ? 1.5 : 1) * (m.a ?? 100) / 100 }; });
  if (Math.random() < .7) return scored.sort((x, y) => y.s - x.s)[0].id;
  return pick(a.moves);
}
async function turn(act) {
  if (!B || B.busy) return;
  B.busy = true; B.mode = "busy"; drawActs();
  B.flinch = {}; B.acted = {};
  const fAct = aiMove(foe(), me());
  if (act.kind === "switch") { B.mi = act.idx; B.part.add(me().ref.id); drawSprites(); drawBars(); say(`Volte! Vai, ${SP[me().sp].n}!`); await sleep(800); B.acted.me = true; }
  if (act.kind === "item") {
    const f = B.mine[act.idx], tmp = { ...f.ref, hp: f.hp, cond: f.cond, bonus: f.ref.bonus, var: f.ref.var, lvl: f.lvl, sp: f.sp };
    const out = []; applyItem(act.id, tmp, out); f.hp = tmp.hp; f.cond = tmp.cond;
    drawBars(); say(out[0]?.t || `Usou ${IT[act.id].n}.`); await sleep(800); B.acted.me = true;
  }
  const q = [];
  if (act.kind === "move") q.push({ side: "me", mv: act.id });
  q.push({ side: "foe", mv: fAct });
  const pri = x => MV[x.mv].pr || 0;
  q.sort((x, y) => pri(y) - pri(x) || eSpeed(y.side === "me" ? me() : foe()) - eSpeed(x.side === "me" ? me() : foe()) || Math.random() - .5);
  for (const x of q) {
    const a = x.side === "me" ? me() : foe(), d = x.side === "me" ? foe() : me();
    if (a.hp <= 0 || d.hp <= 0) continue;
    await doMove(a, d, x.mv, x.side); B.acted[x.side] = true;
  }
  for (const [f, side] of [[me(), "me"], [foe(), "foe"]]) {
    if (f.hp <= 0) continue;
    if (f.cond === "queimadura" || f.cond === "envenenamento") {
      const h = Math.max(1, Math.floor(f.st[0] / (f.cond === "queimadura" ? 16 : 8)));
      f.hp = Math.max(0, f.hp - h); drawBars(); say(`${nameOf(f, side)} sofre com ${f.cond === "queimadura" ? "a queimadura" : "o veneno"}.`); await sleep(650);
    }
  }
  if (foe().hp <= 0) {
    $("#foeSprite").classList.add("faint"); say(`${nameOf(foe(), "foe")} desmaiou!`); await sleep(900);
    B.xpPool += foe().lvl * CFG.xp_batalha_fator;
    const nx = B.foe.findIndex(f => f.hp > 0);
    if (nx < 0) return endBattle(true);
    B.fi = nx; drawSprites(); drawBars(); say(`${B.t.n} enviou ${SP[foe().sp].n}.`); await sleep(800);
  }
  if (me().hp <= 0) {
    $("#meSprite").classList.add("faint"); say(`${SP[me().sp].n} desmaiou!`); await sleep(900);
    if (!B.mine.some(f => f.hp > 0)) return endBattle(false);
    B.busy = false; B.mode = "forced"; drawActs(); say("Escolha quem entra.");
    return;
  }
  B.busy = false; B.mode = "moves"; drawActs();
  say(`O que ${SP[me().sp].n} vai fazer?`);
}
async function forcedSwitch(i) {
  B.mi = i; B.part.add(me().ref.id); drawSprites(); drawBars(); say(`Vai, ${SP[me().sp].n}!`);
  B.mode = "moves"; drawActs();
}
function endBattle(win, gaveUp = false) {
  const bt = game.batalha, t = B.t, lines = [];
  B.mine.forEach(f => { f.ref.hp = Math.max(0, f.hp); f.ref.cond = f.hp > 0 ? f.cond : null; });
  if (win) {
    const maxL = Math.max(...t.team.map(x => x.lvl));
    const coins = Math.round(maxL * CFG.moedas_por_nivel * (bt.rematch ? CFG.revanche_fator : 1));
    game.dinheiro += coins; game.conq.vitorias++;
    const v = game.vencidos[ROUTES[bt.route].id] = game.vencidos[ROUTES[bt.route].id] || [];
    if (!v.includes(t.id)) v.push(t.id);
    lines.push({ t: `Você venceu ${t.n} e ganhou ${money(coins)} moedas.` });
    if (!bt.rematch && t.item && IT[t.item]) { game.inv[t.item] = (game.inv[t.item] || 0) + 1; lines.push({ t: `${t.n} te deu: ${IT[t.item].n}.` }); }
    lines.push({ t: `Toda a equipe ganhou ${money(B.xpPool)} de experiência.` });
    B.mine.map(f => getMon(f.ref.id)).filter(Boolean).forEach(m => applyXP(m, B.xpPool, lines, learnQueue));   /* a equipe inteira recebe o XP, não só quem lutou */
    if (routeCleared(bt.route) && !bt.rematch && v.length === trainersOf(bt.route).length) {
      lines.push({ t: bt.route < ROUTES.length - 1 ? `${ROUTES[bt.route].n} concluída! ${ROUTES[bt.route + 1].n} está liberada no mapa.` : "Você venceu a Mestra da Liga!" });
      addLog(`${ROUTES[bt.route].n} concluída.`);
    }
    addLog(`Venceu ${t.n}${bt.rematch ? " (revanche)" : ""}.`);
    checkMythics(lines);
  } else {
    lines.push({ t: gaveUp ? `Você desistiu da batalha contra ${t.n}.` : `Sua equipe desmaiou. ${t.n} venceu desta vez.` });
    lines.push({ t: "Cure sua equipe com Alimentação ou itens e tente de novo." });
    addLog(`Perdeu para ${t.n}.`);
  }
  game.batalha = null; saveGame(); B = null;
  showResults(win ? "Vitória!" : "Derrota", lines);
}
